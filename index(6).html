<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Lernplattform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: ein Schulheft – Kästchenpapier als Grund, Aufgaben als Blätter mit rotem Heftrand,
   Nummern und Korrekturen stehen handschriftlich im Rand. */
:root{
  --paper:#f6f8fb; --sheet:#ffffff; --grid:rgba(60,100,170,.075);
  --ink:#1b2333; --ink-2:#5a6478; --ink-3:#8a93a5; --line:#dfe4ec; --line-2:#c9d1dd;
  --blue:#2747a8; --blue-2:#1d3784; --blue-soft:#e9eefb; --on-blue:#ffffff;
  --red:#c8352b; --red-soft:#fcebe9;
  --green:#1d7a4b; --green-soft:#e2f3e9;
  --amber:#9a5c00; --amber-soft:#fcf1dc;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121825; --sheet:#1a2131; --grid:rgba(140,170,230,.06);
  --ink:#e7eaf1; --ink-2:#a2abbd; --ink-3:#717b90; --line:#2b3446; --line-2:#3a4559;
  --blue:#93abff; --blue-2:#b4c5ff; --blue-soft:#1f2b4f; --on-blue:#0c1226;
  --red:#ff8073; --red-soft:#3a1f1d; --green:#62d29b; --green-soft:#16352a; --amber:#f0b45c; --amber-soft:#382a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121825; --sheet:#1a2131; --grid:rgba(140,170,230,.06);
  --ink:#e7eaf1; --ink-2:#a2abbd; --ink-3:#717b90; --line:#2b3446; --line-2:#3a4559;
  --blue:#93abff; --blue-2:#b4c5ff; --blue-soft:#1f2b4f; --on-blue:#0c1226;
  --red:#ff8073; --red-soft:#3a1f1d; --green:#62d29b; --green-soft:#16352a; --amber:#f0b45c; --amber-soft:#382a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;min-height:100vh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0;font-weight:600}
h1{font-size:1.65rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap.schmal{max-width:820px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.klein{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Kopfleiste */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.kopf-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap}
.marke{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;white-space:nowrap}
.marke-logo{width:30px;height:30px;border-radius:7px;background:var(--blue);display:grid;place-items:center;color:var(--on-blue);font-family:var(--hand);font-size:1.35rem;line-height:1}
.wer{font-size:.9rem;color:var(--ink-2);white-space:nowrap}
.wer b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{border:0;background:none;padding:17px 12px 15px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .zahl{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:.75rem;line-height:20px;text-align:center}
@media (max-width:760px){.kopf-in{padding-top:8px}.tabs{order:5;width:100%}.tabs button{padding:10px 10px 9px}}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--sheet);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primaer{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primaer:hover{background:var(--blue-2);border-color:var(--blue-2);color:var(--on-blue)}
.btn.gefahr{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line-2))}
.btn.gefahr:hover{background:var(--red-soft)}
.btn.leise{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.leise:hover{color:var(--blue);background:var(--blue-soft)}
.btn.gross{padding:12px 20px;font-size:1.05rem}
.btn.klein{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Felder */
label.feld{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--ink-2);font-weight:500;min-width:0}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=date],select,textarea{
  border:1px solid var(--line-2);background:var(--sheet);border-radius:8px;padding:9px 11px;width:100%;min-width:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
textarea{resize:vertical}

/* Blätter (Karten) */
.blatt{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.blatt.pad{padding:20px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:500;background:var(--blue-soft);color:var(--blue);white-space:nowrap;line-height:1.6}
.chip.er{background:var(--amber-soft);color:var(--amber)}
.chip.le{background:var(--blue-soft);color:var(--blue)}
.chip.gut{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.schlecht{background:var(--red-soft);color:var(--red)}
.chip.grau{background:color-mix(in srgb,var(--ink-3) 16%,transparent);color:var(--ink-2)}
.balken{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.balken>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.hinweis{border:1px solid color-mix(in srgb,var(--blue) 25%,var(--line));background:var(--blue-soft);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.hinweis.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,var(--line))}
.leer{padding:34px 20px;text-align:center;color:var(--ink-2)}

/* Start */
.start{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px}
.start-box{width:min(460px,100%);display:flex;flex-direction:column;gap:18px}
.start-kopf{display:flex;align-items:center;gap:12px}
.start-kopf .marke-logo{width:44px;height:44px;font-size:2rem;border-radius:10px}
.code-eingabe{font-size:1.6rem!important;letter-spacing:.18em;text-align:center;text-transform:uppercase;padding:14px!important;font-weight:600}
.demo-band{border:1px dashed var(--line-2);border-radius:var(--r);padding:12px 14px;font-size:.88rem;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;background:var(--sheet)}
.code-demo{border:0;background:none;padding:0;cursor:pointer}
.demo-band code{font-family:var(--mono);background:var(--blue-soft);color:var(--blue);padding:1px 6px;border-radius:5px;cursor:pointer;border:0}

/* Aufgabenkarten mit Heftrand */
.aufgabe{display:grid;grid-template-columns:52px minmax(0,1fr);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rand{border-right:2px solid color-mix(in srgb,var(--red) 55%,transparent);padding:14px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.rand .nr{font-family:var(--hand);font-size:1.7rem;line-height:1;color:var(--ink-2);font-weight:700}
.rand .mark{font-family:var(--hand);font-size:1.25rem;line-height:1;font-weight:700;color:var(--red);transform:rotate(-6deg)}
.rand .mark.ok{color:var(--green)}
.inhalt{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.typ{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frage{white-space:pre-wrap;font-size:1.04rem;overflow-wrap:anywhere}
.aufgabe.info .rand .nr{font-size:1.3rem}
.aufgabe.info .frage{font-size:1rem;line-height:1.65}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--sheet)}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--blue);flex:none}
.opt.an{border-color:var(--blue);background:var(--blue-soft)}
.rf-zeile{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.rf-zeile:last-child{border-bottom:0}
.rf-zeile>span{flex:1 1 240px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--sheet);padding:7px 14px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.zu-zeile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center}
.zu-zeile .links{padding:9px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line);overflow-wrap:anywhere}
@media (max-width:560px){.zu-zeile{grid-template-columns:1fr}}
.cloze{line-height:2.4;white-space:pre-wrap;overflow-wrap:anywhere}
.cloze input{display:inline-block;width:auto;min-width:7em;padding:3px 8px;border-radius:6px;border-width:0 0 2px;border-color:var(--blue);background:var(--blue-soft);font-weight:500}
.wortspeicher{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px dashed var(--line-2);border-radius:8px}
.wortspeicher span{padding:2px 10px;border-radius:6px;background:var(--paper);border:1px solid var(--line);font-size:.92rem}
.reihe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reihe li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.reihe .pos{font-family:var(--hand);font-size:1.3rem;color:var(--ink-2);width:22px;text-align:center;font-weight:700}
.reihe li>span:not(.pos){flex:1;min-width:0;overflow-wrap:anywhere}
.reihe .pfeile{display:flex;gap:4px}
.reihe .pfeile button{width:34px;height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--sheet);cursor:pointer}
.reihe .pfeile button:hover{border-color:var(--blue);color:var(--blue)}
.reihe .pfeile button:disabled{opacity:.3;cursor:default}
.zaehler{font-size:.8rem;color:var(--ink-3);text-align:right}

/* Brüche */
.bruch{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-size:.9em;margin:0 .12em;font-variant-numeric:tabular-nums;white-space:nowrap}
.bruch .bz{padding:0 .2em .05em;border-bottom:1.5px solid currentColor}
.bruch .bn{padding:.05em .2em 0}
.frage .bruch,.opt .bruch{font-size:.95em}
.bruch-vorschau{font-size:.88rem;color:var(--ink-2);min-height:1.2em}
.bruch-vorschau .bv{color:var(--ink);font-size:1.05rem;margin-left:4px}
/* Bilder */
.bilder{display:flex;flex-wrap:wrap;gap:10px}
.aufgabe-bild{cursor:zoom-in;max-height:380px;max-width:100%;height:auto;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--sheet)}
.aufgabe-bild.laedt{min-width:160px;min-height:120px;background:var(--paper)}
img.mini,.mini{width:44px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:var(--paper);flex:none}
.sim-mini{display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
/* Simulationen */
.sim{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet);display:flex;flex-direction:column}
.sim-kopf{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;font-size:.82rem;color:var(--ink-2);border-bottom:1px solid var(--line)}
.sim iframe{width:100%;height:var(--sim-h,520px);border:0;display:block;background:var(--sheet)}
.sim-platz{height:var(--sim-h,520px);display:grid;place-items:center;color:var(--ink-2);padding:20px;text-align:center}
.sim:fullscreen{border-radius:0}
.sim:fullscreen iframe{height:calc(100vh - 42px)}
@media (max-width:560px){.sim iframe,.sim-platz{height:min(var(--sim-h,520px),75vh)}}
details.dateien{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--sheet)}
details.dateien summary{cursor:pointer;font-weight:500;font-size:.9rem}
details.dateien[open] summary{margin-bottom:8px}
.datei-zeile{padding:6px 0;border-top:1px dashed var(--line)}

/* Auswertung in Aufgaben */
.rv{display:flex;flex-direction:column;gap:6px}
.rv-zeile{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;background:var(--paper);overflow-wrap:anywhere}
.rv-zeile .ic{flex:none;width:20px;font-weight:700;text-align:center}
.rv-zeile.ok{background:var(--green-soft)}
.rv-zeile.ok .ic{color:var(--green)}
.rv-zeile.falsch{background:var(--red-soft)}
.rv-zeile.falsch .ic{color:var(--red)}
.rv-zeile .soll{display:block;font-size:.85rem;color:var(--green);font-weight:500}
.rv-zeile>div{min-width:0;flex:1}
.gap-ok{background:var(--green-soft);color:var(--green);padding:1px 6px;border-radius:5px;font-weight:500}
.gap-falsch{background:var(--red-soft);color:var(--red);padding:1px 6px;border-radius:5px;text-decoration:line-through;text-decoration-thickness:1px}
.gap-soll{color:var(--green);font-weight:600;padding:0 4px}
.erklaerung{border-left:3px solid var(--blue);padding:6px 12px;background:var(--blue-soft);border-radius:0 8px 8px 0;font-size:.93rem;white-space:pre-wrap}
.antwort-box{white-space:pre-wrap;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line);overflow-wrap:anywhere}
.loesung{font-size:.9rem;padding:8px 12px;border-radius:8px;background:var(--green-soft);color:var(--ink)}
.loesung b{color:var(--green)}
.bewerten{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:10px;border-top:1px dashed var(--line);font-size:.9rem}
.bewerten input{width:84px}

/* Listen von Aufgabenblättern */
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.setkarte{display:flex;flex-direction:column;gap:10px;padding:16px 18px;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow)}
.setkarte:hover{border-color:var(--blue)}
.setkarte h3{font-size:1.08rem}
.setkarte .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bald{display:flex;flex-direction:column;gap:6px}
.bald div{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border:1px dashed var(--line-2);border-radius:8px;color:var(--ink-2);flex-wrap:wrap}
.abschnitt{display:flex;flex-direction:column;gap:12px}
.abschnitt-titel{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* Bearbeitungsansicht */
.bearb-kopf{display:flex;flex-direction:column;gap:10px}
.speicher{font-size:.85rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.speicher i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.speicher.wartet i{background:var(--amber)}
.speicher.fehler{color:var(--red)}.speicher.fehler i{background:var(--red)}
.fuss{position:sticky;bottom:0;z-index:4;background:var(--sheet);border-top:1px solid var(--line);margin-top:20px}
.fuss-in{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fuss-in .balken{flex:1 1 140px}

/* Ergebnisse Schüler */
.gesamt{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.gesamt-zahl{font-size:3rem;font-weight:700;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.gesamt-teile{display:flex;gap:18px;flex-wrap:wrap}
.gesamt-teile div{display:flex;flex-direction:column}
.gesamt-teile b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.erg-zeile{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px;gap:14px;align-items:center;padding:14px 18px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-top:1px solid var(--line)}
.erg-zeile:first-child{border-top:0}
.erg-zeile:hover{background:var(--paper)}
.erg-zeile .proz{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.erg-zeile{grid-template-columns:minmax(0,1fr) 60px}.erg-zeile .balken{display:none}}

/* Lehrkraft: Matrix */
.filter{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filter>label{flex:0 1 180px}
.seg-art{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg-art button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg-art button+button{border-left:1px solid var(--line-2)}
.seg-art button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer;color:var(--ink-2)}
.check input{width:17px;height:17px;accent-color:var(--blue)}
.tabelle-box{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);box-shadow:var(--shadow)}
table.matrix{border-collapse:separate;border-spacing:0;font-size:.88rem;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.matrix thead th{background:var(--sheet);position:sticky;top:0;z-index:2;font-weight:500;vertical-align:bottom}
.matrix .namesp{position:sticky;left:0;z-index:1;background:var(--sheet);text-align:left;border-right:2px solid color-mix(in srgb,var(--red) 50%,transparent);min-width:170px}
.matrix thead .namesp{z-index:3}
.matrix .namesp button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500}
.matrix .namesp button:hover{color:var(--blue)}
.matrix .namesp small{display:block;color:var(--ink-3);font-family:var(--mono);font-size:.75rem;font-weight:400}

/* ---------- Auswertung ---------- */
function berechneAuswertung() {
  var ld = st.ld, f = st.filter;
  var von = f.von ? new Date(f.von + 'T00:00').getTime() : null, bis = f.bis ? new Date(f.bis + 'T23:59:59').getTime() : null;
  var sets = ld.sets.filter(function (s) {
    if ((s.klassen || []).indexOf(f.klasse) < 0) return false;
    if (f.art !== 'alle' && s.art !== f.art) return false;
    if (LP.phase(s, ld.jetzt) === 'geplant') return false;
    if (von && s.ende < von) return false;
    if (bis && s.start > bis) return false;
    return true;
  }).sort(function (a, b) { return a.start - b.start; });
  var schueler = ld.schueler.filter(function (s) { return s.klasse === f.klasse; });
  var abg = {};
  ld.abgaben.forEach(function (x) { abg[x.set + '|' + x.code] = x; });
  var zellen = {}, gesamt = {};
  schueler.forEach(function (s) {
    zellen[s.code] = {};
    var zaehlen = [];
    sets.forEach(function (set) {
      var e = LP.bewerteSet(aufgabenVon(set), abg[set.id + '|' + s.code]);
      zellen[s.code][set.id] = e;
      if (f.laufende || LP.phase(set, ld.jetzt) === 'beendet') zaehlen.push({ e: e, art: set.art });
    });
    gesamt[s.code] = {
      alle: LP.summiere(zaehlen.map(function (x) { return x.e; })),
      er: LP.summiere(zaehlen.filter(function (x) { return x.art === 'erarbeitung'; }).map(function (x) { return x.e; })),
      le: LP.summiere(zaehlen.filter(function (x) { return x.art === 'lernen'; }).map(function (x) { return x.e; })),
      bearb: zaehlen.length ? Math.round(zaehlen.reduce(function (a, x) { return a + x.e.bearbeitet; }, 0) / zaehlen.length) : null,
      offen: zaehlen.reduce(function (a, x) { return a + x.e.offen; }, 0),
      verlassen: sets.reduce(function (a, set) { var x = abg[set.id + '|' + s.code]; return a + (set.aufsicht && x ? x.verlassen || 0 : 0); }, 0),
      wegzeit: sets.reduce(function (a, set) { var x = abg[set.id + '|' + s.code]; return a + (set.aufsicht && x ? x.wegzeit || 0 : 0); }, 0),
      erfasst: sets.some(function (set) { return set.aufsicht; })
    };
  });
  return { sets: sets, schueler: schueler, zellen: zellen, gesamt: gesamt, abg: abg };
}

    ['Tippfehler', 'Aufgabe 5 (Texteingabe)\nWie heißt der Vorgang?\nLösung: Fotosynthese\nTippfehler: erlaubt', 'Erlaubt bei Wörtern ab 5 Buchstaben einen Tippfehler (ab 10 Buchstaben zwei), z. B. „Fotosynthse“. Gilt nicht für Zahlen. Für das ganze Blatt: „TIPPFEHLER: erlaubt“ ganz oben. Die Lernenden sehen später die richtige Schreibweise.'],
    ['Lückentext', 'Aufgabe 5 (Lückentext)\nWortspeicher: ja\nDer [Igel] frisst [Insekten|Käfer].', 'Lösungswort in eckige Klammern. In Word kannst du die Lückenwörter auch einfach unterstreichen. Alternativen mit |. Zahlen, ± und „Tippfehler: erlaubt“ funktionieren wie bei der Texteingabe.'],
    ['Reihenfolge', 'Aufgabe 6 (Reihenfolge)\n1. Laich\n2. Kaulquappe\n3. Frosch', 'In der richtigen Reihenfolge nummerieren. Die Lernenden bekommen sie gemischt.'],

    ['Brüche', 'Aufgabe 11 (Texteingabe)\nBerechne 1/2 + 1/4.\nLösung: 3/4\nBruch: gekürzt', 'Schreibe Brüche als 3/4 oder gemischt als 2 1/2 – sie erscheinen als echte Brüche. Bei der Bewertung zählen gleichwertige Werte (6/8, 0,75). Mit „Bruch: gekürzt“ (oder „BRUCH: gekürzt“ ganz oben für das ganze Blatt) zählt nur der vollständig gekürzte Bruch. Brüche aus dem Word-Formeleditor gehen beim Hochladen verloren – dort bitte 3/4 tippen.'],
    ['Simulation', 'Aufgabe 9 (Info)\nUntersuche das Pendel.\nSimulation: https://phet.colorado.edu/…\nHöhe: 600', 'Bettet eine Simulation ein – in jeder Aufgabenart möglich, z. B. direkt über einer Frage. Eigene HTML-Dateien lädst du im Editor mit „+ Simulation hochladen“ hoch (bis 5 MB), dann steht dort „Simulation: datei:…“. Auch Internetadressen (PhET, GeoGebra, LearningApps …) und Dateien aus dem GitHub-Ordner „simulationen“ gehen. Höhe in Pixeln ist optional.']
  ];
  var vorlage = 'TITEL: Mein Aufgabenblatt\nART: Lernaufgabe\n\n' + beispiele.map(function (b, i) { return b[1].replace(/^Aufgabe \d+/, 'Aufgabe ' + (i + 1)); }).join('\n\n');

    h('div', { class: 'tabelle-box', style: 'box-shadow:none' }, h('table', { class: 'schueler-tab', style: 'min-width:640px' }, beispiele.map(function (b) {

        h('td', { class: 'muted', style: 'padding:10px 12px;vertical-align:top;font-size:.86rem' }, b[2]));
